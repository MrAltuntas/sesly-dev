plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.seslymedia'
version = '1.0.0'

android {
  namespace "expo.modules.seslymedia"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // Same Media3 line as expo-audio (node_modules/expo-audio/android/build.gradle),
  // so Gradle resolves one version for both modules.
  def androidxMedia3Version = "1.8.0"
  implementation "androidx.media3:media3-common:$androidxMedia3Version"
  implementation "androidx.media3:media3-session:$androidxMedia3Version"
  implementation 'androidx.core:core-ktx:1.15.0'
}
