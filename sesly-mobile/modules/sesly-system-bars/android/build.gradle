plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.seslysystembars'
version = '1.0.0'

android {
  namespace "expo.modules.seslysystembars"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // ReactModalHostView and UIManagerHelper (the Modal's own window). The
  // version comes from the React Native Gradle plugin, as for expo-modules-core.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.15.0'
}
