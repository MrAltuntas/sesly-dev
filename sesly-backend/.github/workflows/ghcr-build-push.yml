name: Build & Push to GHCR

# Every push to main builds the Docker image and publishes it to GHCR. The
# server runs Watchtower, which pulls the new :latest and restarts the
# container, so a green run here is a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/slymn08183/sesly-backend

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests with the coverage thresholds from package.json. A red run here
  # stops the image from being built, so broken code never reaches the server.
  test:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts refuses to load without it. Nothing connects: the
      # unit tests mock the database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run test:cov

  build-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # No build-time secrets: runtime configuration comes from the
      # container's environment on the server, never from this image.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
