version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: sesly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres_sesly
      POSTGRES_PASSWORD: sesly_local_dev
      POSTGRES_DB: sesly
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sesly-network

  redis:
    image: redis:7-alpine
    container_name: sesly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sesly-network

volumes:
  postgres_data:
  redis_data:

networks:
  sesly-network:
    driver: bridge
