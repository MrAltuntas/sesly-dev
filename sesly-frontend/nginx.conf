server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enhanced Gzip compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/json
        application/javascript
        application/xml
        image/svg+xml;
    gzip_disable "msie6";

    # Brotli compression (if module available)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content Security Policy (adjust as needed)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

    # Public routes are prerendered at build time (scripts/prerender-routes.mjs):
    # /privacy is privacy.html, and so on, each with its own title and canonical.
    # Anything that is neither a file nor a route answers 404 (404.html, still
    # the app shell, marked noindex) instead of a 200 copy of the home page,
    # which Search Console reported as duplicates. No trailing-slash directory
    # lookup, so no extra redirects either.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    # Firebase email action links (/auth/action?mode=...&oobCode=...). The SPA
    # entry is served from this location (try_files serves a found file in the
    # current location, no internal redirect), so these headers apply on a
    # first visit and on a refresh: never indexed, never cached, and the
    # one-time code in the URL is never sent on as a referrer. add_header here
    # replaces the server-level headers, so the security headers are repeated.
    location ^~ /auth/ {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Cache static assets with versioned filenames
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Enable ETag for better caching
        etag on;
    }

    # Cache images and fonts
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        etag on;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        etag on;
    }

    # Don't cache index.html (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        etag on;
    }

    # Unknown paths: real 404 status with the app shell (noindex).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
